name: Build
description: Make and archive artifact.
inputs:
  archive:
    default: viewer.tar.gz
  desktop:
    default: include/viewer.desktop
  icon:
    default: icons/scalable/actions/viewer.svg
  schema:
    default: include/viewer.gschema.xml
runs:
  using: composite
  steps:
    - shell: sh
      run: |
        make
        tar -cvzf ${{ inputs.archive }} Makefile bin ${{ inputs.desktop }} ${{ inputs.schema }} ${{ inputs.icon }}
